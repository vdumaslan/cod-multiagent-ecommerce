# Stage 1 using locally downloaded Home & Kitchen JSONL files (two-pass scan).
# Run from repo root after: python seller-copilot/scripts/download_amazon_hk_raw.py
#
#   python seller-copilot/src/data_acquisition/scripts/run_stage1.py \
#     --config seller-copilot/config/stage1_amazon_hk_local.yaml
#
# ingestion.max_reviews / max_meta: 0 = no cap (full collection for selected products).

project:
  project_id: linear-theater-436300-r9
  dataset: seller_copilot_prod
  location: US
  service_account_key_path:

source:
  repo_id: McAuley-Lab/Amazon-Reviews-2023
  home_kitchen_review_path: raw/review_categories/Home_and_Kitchen.jsonl
  home_kitchen_meta_path: raw/meta_categories/meta_Home_and_Kitchen.jsonl
  use_local_files: true
  local_reviews_path: seller-copilot/data/raw/amazon_reviews_2023/Home_and_Kitchen.jsonl
  local_meta_path: seller-copilot/data/raw/amazon_reviews_2023/meta_Home_and_Kitchen.jsonl

ingestion:
  max_reviews: 0
  max_meta: 0

quality_gates:
  min_reviews_per_product: 15
  min_title_chars: 8
  min_review_chars: 30
  min_price_percentile: 0.01
  max_price_percentile: 0.99
  max_products: 100000
  recent_year_floor: 2018

ops:
  # Local dev: set require_bigquery true only when you want to load GCP.
  reset_bigquery_tables: false
  require_bigquery: false
  agent_dataset_dir: seller-copilot/data/agent_dataset
