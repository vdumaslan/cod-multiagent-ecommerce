name: seller-copilot
prefect-version: "3.0.0"

deployments:
  - name: seller-copilot-daily
    tags:
      - seller-copilot
      - data-pipeline
    description: Daily cloud run for seller copilot pipeline.
    entrypoint: seller-copilot/src/data_acquisition/flows/stage1_amazon_hk_flow.py:run_stage1
    parameters:
      config_path: seller-copilot/config/stage1_amazon_hk.yaml
    schedules:
      - cron: "0 2 * * *"
        timezone: "America/Los_Angeles"
        active: true

  - name: seller-copilot-eval
    tags:
      - seller-copilot
      - evaluation
    description: Evaluation orchestration wrapper for model comparison artifacts.
    entrypoint: seller-copilot/src/data_acquisition/flows/eval_pipeline_flow.py:run_eval_pipeline
    schedules: []
